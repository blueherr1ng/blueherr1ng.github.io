<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camera test</title>
<style>
  html,body{ margin:0; }
  body{ height:300vh; font-family:Georgia,serif; }
  #c{ position:fixed; inset:0; display:block; z-index:0; }
  #intro{
    position:fixed; z-index:2; left:6vw; top:50%; transform:translateY(-50%);
    max-width:32rem; color:#16201c;
  }
  #intro h1{ margin:0 0 .8rem; font-size:clamp(2rem,1rem+3vw,3.4rem); font-weight:400; }
  #intro a{ margin-right:1.2rem; color:#16201c; }
  #hud{
    position:fixed; z-index:5; right:1rem; bottom:1rem;
    font:12px monospace; background:#000; color:#0f0; padding:.4rem .6rem;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="intro">
  <h1>hi, i'm mirabelle</h1>
  <p>
    <a href="#">resume</a>
    <a href="#">email</a>
    <a href="#">itch.io</a>
  </p>
</div>

<div id="hud">t = 0.00</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// The browser restores scroll on reload. Start at the top, always.
history.scrollRestoration = 'manual';
scrollTo(0, 0);

const canvas = document.querySelector('#c');
const intro  = document.querySelector('#intro');
const hud    = document.querySelector('#hud');



const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe3d2ac);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a894, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(-8, 12, 6);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff, 0.25);
fill.position.set(8, 3, -6);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 500);

let posA, qA, fovA, posB, qB, fovB, ready = false;

new GLTFLoader().load('assets/computer.glb', (gltf) => {
  scene.add(gltf.scene);

  gltf.cameras.forEach((c, i) =>
    console.log(i, c.parent ? c.parent.name : '(no parent)', 'fov', c.fov));

  const wide = gltf.cameras[1];    // cam_init  — far, angled
  const near = gltf.cameras[0];    // cam_screen — straight on

  posA = wide.getWorldPosition(new THREE.Vector3());
  qA   = wide.getWorldQuaternion(new THREE.Quaternion());
  fovA = wide.fov;
  fovA = 28;

  const DOLLY = 0;
  const fwd   = new THREE.Vector3(0, 0, -1).applyQuaternion(qA);
  const right = new THREE.Vector3(1, 0,  0).applyQuaternion(qA);
  const up    = new THREE.Vector3(0, 1,  0).applyQuaternion(qA);

  const SUBJECT_LEFT = 3;   // larger = the computer moves further left on screen
  const SUBJECT_UP   = 1.5;   // larger = the computer moves further up on screen

  posA.addScaledVector(fwd,   DOLLY);
  posA.addScaledVector(right, SUBJECT_LEFT);
  posA.addScaledVector(up,   -SUBJECT_UP);

  posB = near.getWorldPosition(new THREE.Vector3());
  qB   = near.getWorldQuaternion(new THREE.Quaternion());
  fovB = near.fov;
  posB.y -= 1.5;

  console.log('START at', posA.toArray().map(n => n.toFixed(2)).join(', '));
  console.log('END   at', posB.toArray().map(n => n.toFixed(2)).join(', '));

  ready = true;
}, undefined, err => console.error('LOAD FAILED — check assets/computer.glb', err));

let target = 0, eased = 0;
function readScroll(){
  const span = document.body.scrollHeight - innerHeight;
  target = span > 0 ? Math.min(1, Math.max(0, scrollY / span)) : 0;
}
addEventListener('scroll', readScroll, { passive:true });
readScroll();

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;

function tick(){
  requestAnimationFrame(tick);
  if (!ready) return;

  eased += (target - eased) * 0.09;
  const t = ease(eased);

  camera.position.lerpVectors(posA, posB, t);
  camera.quaternion.slerpQuaternions(qA, qB, t);
  camera.fov = THREE.MathUtils.lerp(fovA, fovB, t);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);

  intro.style.opacity = 1 - Math.min(1, t / 0.40);
  hud.textContent = 't = ' + t.toFixed(2);
}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
tick();
</script>

</body>
</html>
